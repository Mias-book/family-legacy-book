

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Начало моей истории</title>

<style>

body {

  font-family: Georgia, serif;

  background: #f7f2e9;

  color: #514638;

  max-width: 700px;

  margin: 50px auto;

  padding: 25px;

  line-height: 1.7;

}

h1 {

  font-weight: normal;

  text-align: center;

}

p {

  font-size: 18px;

}

label {

  display: block;

  margin-top: 22px;

}

input, textarea, select {

  width: 100%;

  box-sizing: border-box;

  padding: 12px;

  margin-top: 8px;

  border: 1px solid #c9bda9;

  border-radius: 5px;

  background: #fffdf9;

  font-size: 16px;

}

textarea {

  min-height: 100px;

}

button {

  margin-top: 25px;

  padding: 13px 25px;

  background: #8b755b;

  color: white;

  border: none;

  border-radius: 5px;

  font-size: 16px;

}

</style>

</head>

<body>

<h1>Начало моей истории</h1>

<p>Каждая семейная история начинается с человека. Давайте познакомимся.</p>

<label>На каком языке вы хотите создавать свою книгу?</label>

<select>

<option>Русский</option>

<option>Polski</option>

<option>ქართული</option>

</select>

<label>Как вас зовут?</label>

<input type="text" placeholder="Ваше имя">

<label>Сколько вам лет?</label>

<input type="number" placeholder="Ваш возраст">

<label>Для кого вы хотите сохранить свою историю?</label>

<select>

<option>Для детей</option>

<option>Для внуков и будущих поколений</option>

<option>Для себя</option>

<option>Для всей семьи</option>

</select>

<label>С чего вы хотели бы начать рассказ?</label>

<textarea placeholder="Напишите несколько слов о себе..."></textarea>

<button type="button">Сохранить начало истории</button>

</body>

</html>
